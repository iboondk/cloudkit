---
# Runs first, before any package, SSH or firewall change, so a bad input stops the play
# while the host is still untouched. Keep these asserts ahead of every other task file.
#
# If the SSH port is not in the firewall allow list, the firewall would drop the port
# that sshd is moved to, so the host would be locked out after the drop-in is deployed.
- name: Refuse to run if the SSH port would be blocked by the firewall
  ansible.builtin.assert:
    that:
      - (hardening_ssh_port | int) in (hardening_allow_tcp_ports | map('int') | list)
    fail_msg: "hardening_ssh_port ({{ hardening_ssh_port }}) must be listed in hardening_allow_tcp_ports or the host will be locked out."

# Ubuntu 24.04 (noble) uses socket activation: the listening port comes from
# ssh.socket, not from sshd_config. Changing the port there can lock the host out
# unless the socket is regenerated, so the change is refused unless the operator opts in.
- name: Refuse a non-22 SSH port on Ubuntu noble unless explicitly allowed
  ansible.builtin.assert:
    that:
      - (hardening_ssh_port | int) == 22 or ansible_facts['distribution_release'] != 'noble' or hardening_allow_nonstandard_ssh_port_on_noble | bool
    fail_msg: >-
      hardening_ssh_port ({{ hardening_ssh_port }}) on Ubuntu noble needs
      hardening_allow_nonstandard_ssh_port_on_noble: true, because ssh.socket
      controls the listening port there. Verify access from a second session first.
