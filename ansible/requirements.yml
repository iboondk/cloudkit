---
# Upper bounds keep the collections on releases that support ansible-core 2.15, the
# role's min_ansible_version. community.general 10.x requires ansible-core >=2.15 and
# 11.0.0 requires >=2.16. ansible.posix 2.x requires >=2.15.
collections:
  - name: ansible.posix
    version: ">=1.5.0,<3.0.0"
  - name: community.general
    version: ">=8.0.0,<11.0.0"
