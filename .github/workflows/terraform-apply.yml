name: terraform-apply

# Applies the dev stack after a merge to main. The apply role trusts only
# ref:refs/heads/main and the production environment (see terraform/bootstrap).

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tf-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1
  WORKDIR: terraform/envs/dev

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    if: vars.AWS_APPLY_ROLE_ARN != ''
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init with remote state
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply saved plan
        run: terraform apply -input=false tfplan
