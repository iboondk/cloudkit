name: ci

# Credential-free checks for every push and pull request. No AWS credentials,
# no remote state and no deployment happen here. The Terraform plan and apply
# workflows are separate files (terraform-plan.yml, terraform-apply.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  ANSIBLE_CORE_VERSION: "2.17.14"

jobs:
  static-tests:
    name: Python structural tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyYAML
        run: python -m pip install "pyyaml==6.0.3"

      - name: Run unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Teardown dry run (must run nothing)
        run: bash scripts/teardown.sh --dry-run

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

  terraform-offline:
    name: Terraform offline checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive terraform

      - name: Init without backend, validate every root and module, offline tests
        run: |
          for d in terraform/modules/* terraform/envs/dev terraform/bootstrap; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
          terraform -chdir=terraform/envs/dev test

  ansible-syntax:
    name: Ansible syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ansible-core
        run: python -m pip install "ansible-core==${{ env.ANSIBLE_CORE_VERSION }}"

      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check
        working-directory: ansible
        run: ansible-playbook --syntax-check site.yml
